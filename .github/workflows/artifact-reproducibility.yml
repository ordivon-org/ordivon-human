name: Human artifact reproducibility

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  artifact-reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Record bounded B3 evidence identity
        shell: bash
        run: |
          set -euo pipefail
          printf 'evidence_stage=B3-artifact-reproducibility\n'
          printf 'event=%s\n' "$GITHUB_EVENT_NAME"
          printf 'github_sha=%s\n' "$GITHUB_SHA"
          printf 'checkout_head=%s\n' "$(git rev-parse HEAD)"
          printf 'head_ref=%s\n' "${GITHUB_HEAD_REF:-}"
          printf 'base_ref=%s\n' "${GITHUB_BASE_REF:-}"
          printf 'workflow_ref=%s\n' "$GITHUB_WORKFLOW_REF"
          sha256sum \
            .github/workflows/artifact-reproducibility.yml \
            scripts/owner-environment \
            scripts/check-reproducibility \
            research/economy/evidence/china-2025-baseline.json \
            methods/m0/evidence/population-to-individual.json \
            research/agentic-capability/experiments/evidence/contraction-current.json \
            research/agentic-capability/experiments/evidence/ae1-c1-round1.json \
            research/agentic-capability/experiments/evidence/contraction-20260814.json
      - name: Reproduce committed Human artifacts
        run: scripts/owner-environment cold-start
